version: '3.8'

services:
  # ============================================================================
  # 1. Database Service: MongoDB
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: awdf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: p7
    volumes:
      - mongodb_data:/data/db
    networks:
      - awdf-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. Backend Service: Node.js / Express Task Manager API
  # ============================================================================
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: awdf-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/p7
      - JWT_SECRET=task_manager_secure_jwt_secret_key_2026
      - CACHE_TTL=60
      - CACHE_CHECK_PERIOD=120
      - FRONTEND_URL=http://localhost
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - awdf-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/debug/cache"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # 3. Frontend Service: React Vite Single Page App served by Nginx
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: awdf-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - awdf-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mongodb_data:
    name: awdf_mongodb_data
    driver: local

# ==============================================================================
# Bridge Network for Inter-Container Communication
# ==============================================================================
networks:
  awdf-network:
    name: awdf-network
    driver: bridge
